name: PostgreSQL Tests

# Runs the `#[ignore]`d PostgreSQL storage tests against a real server.
#
# NON-BLOCKING: this is a separate workflow and is NOT a required status check
# on main, so a red run here is visible but never blocks a merge. Promote it to
# a required check (or fold it into ci.yml) once it has been green for a while.
#
# It runs on pushes to main that touch the storage paths below, on the merge
# queue, on manual dispatch, and when `full-ci` is added to a non-draft PR.
# Remove and re-add `full-ci` to request another PR run. Other labels skip
# the job without cancelling an in-flight run. A skip is not a passing suite.
# If `PostgreSQL ignored tests` is required, remove it from branch protection.
#
# Test selection is by name, not by list: every ignored konsensus-storage test
# whose path contains `postgres` runs (e.g. everything in src/postgres.rs,
# including `postgres::migration_recovery_tests::*`). New ignored PostgreSQL
# tests are picked up without editing this file as long as they live in
# src/postgres.rs or carry `postgres` in their test name.
#
# Tests read BITSOV_TEST_POSTGRES_URL and may CREATE/DROP their own databases,
# so the URL must point at a disposable server with a superuser role.
#
# Local equivalent:
#   docker run --rm -d -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:16
#   BITSOV_TEST_POSTGRES_URL=postgres://postgres:postgres@localhost:5432/postgres \
#     cargo test -p konsensus-storage --locked -- --ignored postgres

on:
  push:
    branches: [main]
    paths:
      - 'crates/konsensus-storage/**'
      - 'crates/konsensus-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/postgres.yml'
  merge_group:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate unrelated label events from an in-flight full-ci run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  postgres:
    name: PostgreSQL ignored tests
    # Merge queue, matching main pushes, manual runs, and adding `full-ci`
    # execute the suite. Other labels and draft PRs never do.
    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'merge_group' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.label.name == 'full-ci')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BITSOV_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (upstream has no semver tags)
        with:
          toolchain: stable

      # Cache compiled dependencies as well as downloads. rust-cache includes
      # Cargo.lock, the compiler, and the runner platform in its cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: postgres-${{ hashFiles('Cargo.lock') }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Enable sccache for Cargo
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: cargo test (ignored PostgreSQL tests)
        run: |
          set -o pipefail
          cargo test -p konsensus-storage --locked -- --ignored postgres 2>&1 | tee test.log
          passed=$(grep -cE '^test .+ \.\.\. ok$' test.log || true)
          echo "PostgreSQL tests passed: ${passed}"
          if [ "${passed}" -eq 0 ]; then
            echo "::warning title=No PostgreSQL tests ran::no ignored konsensus-storage test matched 'postgres'"
          fi
