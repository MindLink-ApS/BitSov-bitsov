name: Three-node paid regtest

# Expensive real-node lane; deliberately absent from pull_request and push.
on:
  workflow_dispatch:
    inputs:
      ghost_after_pr200:
        description: 'Enable ghost-channel regression only after PR #200 has merged'
        type: boolean
        default: false
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: three-node-paid-regtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paid-regtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      BITCOIND_SKIP_DOWNLOAD: '1'
      ELECTRS_SKIP_DOWNLOAD: '1'
      ELECTRSD_SKIP_DOWNLOAD: '1'
      REGTEST_TIMEOUT_SECONDS: '3000'
      REGTEST_GHOST_AFTER_PR200: ${{ inputs.ghost_after_pr200 && '1' || '0' }}
      # Hashes transcribed from corepc-node 0.10.1 sha256/bitcoin-core-28.2-SHA256SUMS
      # and electrsd 0.36.1 sha256 (both pinned in Cargo.lock). Verify archives
      # BEFORE extraction or execution; never fetch a mutable checksum at runtime.
      BITCOIN_VERSION: '28.2'
      BITCOIN_SHA256: '98add5f220c01b387343b70edeb6273403fe081e22cd85fda132704cdcaa98aa'
      ELECTRS_COMMIT: 'a33e97e1a1fc63fa9c20a116bb92579bbf43b254'
      ELECTRS_SHA256: '865e26a96e8df77df01d96f2f569dcf9622fc87a8d99a9b8fe30861a4db9ddf1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read Rust toolchain pin
        id: rust-toolchain
        run: echo "channel=$(bash scripts/rust-toolchain-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (upstream has no semver tags)
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: three-node-${{ hashFiles('Cargo.lock') }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Enable sccache for Cargo
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Provision hash-pinned regtest fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/regtest-fixtures"
          mkdir -p "$fixture_dir"
          cd "$fixture_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz" -o bitcoin.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/RCasatta/electrsd/releases/download/electrs_releases/electrs_linux_esplora_${ELECTRS_COMMIT}.zip" -o electrs.zip
          printf '%s  %s\n' "$BITCOIN_SHA256" bitcoin.tar.gz "$ELECTRS_SHA256" electrs.zip | sha256sum --check --strict
          tar -xzf bitcoin.tar.gz
          # This pinned electrsd archive has one executable; do not depend on
          # its internal filename or allow unchecked archive paths to escape.
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('electrs.zip') as archive:
              files = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len(files) == 1, 'expected one pinned electrs executable'
              pathlib.Path('electrs').write_bytes(archive.read(files[0]))
          PY
          chmod 755 electrs
          echo "BITCOIND_EXE=$fixture_dir/bitcoin-${BITCOIN_VERSION}/bin/bitcoind" >> "$GITHUB_ENV"
          echo "ELECTRS_EXE=$fixture_dir/electrs" >> "$GITHUB_ENV"
      - name: Fetch Rust dependencies for the offline runner
        run: cargo fetch --locked
      - name: Runner lifecycle tests
        run: python3 scripts/regress/test_regtest_e2e_runner.py -v
      - name: M6 two-node paid call (real 60-second blocks)
        shell: bash
        env:
          REGTEST_TIMEOUT_SECONDS: '1200'
        run: |
          set -euo pipefail
          # Exit 77 is a failure here: a compiled/skipped call is not proof.
          {
            git log -1 --format='M6 NODE SHA %H'
            scripts/regress/two_node_paid_call_e2e.sh
          } 2>&1 | tee paid-call.log
          grep -q '^M6 CALL PASS reason=unpaid paid_blocks=3 ' paid-call.log
          grep -q '^M6 CALL PASS reason=duration_cap paid_blocks=1 ' paid-call.log
      - name: Two-node approved app grants (messages and real call blocks)
        shell: bash
        env:
          REGTEST_TIMEOUT_SECONDS: '1200'
        run: |
          set -euo pipefail
          scripts/regress/two_node_app_grant_e2e.sh 2>&1 | tee app-grant.log
          grep -q '^APP GRANT PASS message_reply ' app-grant.log
          grep -q '^APP GRANT PASS paid_call paid_blocks=2 ' app-grant.log
          grep -q '^APP GRANT PASS refusal_total ' app-grant.log
          grep -q '^APP GRANT PASS refusal_per_call ' app-grant.log
      - name: Production private hub forwarding (#225)
        shell: bash
        env:
          REGTEST_TEST: 'regtest_e2e::private_forwarding::'
        run: |
          set -euo pipefail
          scripts/regress/regtest_e2e.sh 2>&1 | tee private-forwarding.log
      - name: Three-node paid E2E (skip is a CI failure)
        shell: bash
        run: |
          set +e
          scripts/regress/three_node_paid_e2e.sh 2>&1 | tee regtest.log
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" == 77 ]]; then
            echo '### SKIPPED: required regtest fixtures unavailable' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Regtest skipped (77); this lane requires execution.'
            exit 1
          fi
          if [[ "$REGTEST_GHOST_AFTER_PR200" != 1 ]]; then
            echo 'Ghost/unfunded-channel subscenario SKIPPED: awaiting PR #200. The paid-flow lane still requires execution.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$result" != 0 ]]; then exit "$result"; fi
          grep -q '^THREE-NODE PAID E2E PASS;' regtest.log
          if [[ "$REGTEST_GHOST_AFTER_PR200" == 1 ]]; then
            grep -q '^GHOST UNFUNDED CHANNEL PASS:' regtest.log
          fi
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: three-node-regtest-log
          path: |
            regtest.log
            private-forwarding.log
            paid-call.log
            app-grant.log
          if-no-files-found: ignore
