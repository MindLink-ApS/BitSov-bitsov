name: PR flow

# wip-cap: only the first WIP_CAP open, non-draft PRs (priority label, then age)
# get a success status; the rest are pending with their queue position; drafts
# get a neutral success. pr-size: a PR over PR_SIZE_LIMIT counted lines needs
# label large-ok and a "## Design note" section. Both limits are repository
# variables. This workflow always runs from the default branch.
on:
  workflow_run:
    workflows: ["PR flow trigger"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  statuses: write
  pull-requests: read
  contents: read

concurrency:
  # One run recomputes every open PR, so the newest run wins.
  group: pr-flow
  cancel-in-progress: true

jobs:
  # The job name differs from the status contexts it publishes, so a ruleset
  # that requires wip-cap or pr-size never also requires a job check.
  compute-pr-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TRUSTED_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      WIP_CAP: ${{ vars.WIP_CAP }}
      PR_SIZE_LIMIT: ${{ vars.PR_SIZE_LIMIT }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # No checkout: the gate code comes from the default branch through the
      # API. Only a confirmed 404 (gate not merged yet) skips; any other API
      # error fails the run.
      - name: Load trusted gate and tests through the API
        id: load
        run: |
          python3 -c 'from pathlib import Path; Path("scripts/ci").mkdir(parents=True, exist_ok=True); Path(".github/workflows").mkdir(parents=True, exist_ok=True)'
          trusted_sha=$(gh api --method GET "repos/$GH_REPO/commits/$TRUSTED_BRANCH" --jq .sha)
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          if ! probe=$(gh api --method GET "repos/$GH_REPO/contents/scripts/ci/pr_flow.py" -f "ref=$trusted_sha" --jq .sha 2>&1); then
            if [[ "$probe" == *"HTTP 404"* ]]; then
              echo "::notice::PR flow gate not on $TRUSTED_BRANCH yet; skipping"
              echo "present=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::cannot load the PR flow gate: $probe"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          for path in scripts/ci/pr_flow.py scripts/ci/test_pr_flow.py .github/workflows/pr-flow.yml .github/workflows/pr-flow-trigger.yml; do
            gh api --method GET "repos/$GH_REPO/contents/$path" -f "ref=$trusted_sha" --jq .content |
              python3 -c 'import base64, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(sys.stdin.read()))' "$path"
          done
      - name: Test PR flow gates
        if: steps.load.outputs.present == 'true'
        run: python3 -m unittest scripts/ci/test_pr_flow.py
      - name: Publish wip-cap and pr-size statuses for every open PR
        if: steps.load.outputs.present == 'true'
        run: python3 scripts/ci/pr_flow.py
