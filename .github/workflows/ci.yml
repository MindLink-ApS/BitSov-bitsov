name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'pm/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    # `labeled` / `unlabeled` re-run the workflow when `full-ci` is toggled.
    # Do not put paths-ignore here: a skipped workflow never reports status
    # checks, so branch protection would wait forever. Docs-only and `pm/`
    # skips are job-level; `Frontend Build` always runs.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  # rust-cache and sccache save to the Actions cache.
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Preserve release and main runs; only superseded PR runs are disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Create the `full-ci` label once. The cloud agent token cannot.
      issues: write
    outputs:
      # Pushes, tags, and merge-queue runs always take the Rust path. A PR
      # takes it when any changed file is outside the docs/`pm/` set, when the
      # security policy changed, or when the PR carries `full-ci`.
      rust: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || steps.filter.outputs.rust == 'true' || steps.filter.outputs.security_policy == 'true' }}
      # Cargo Audit is not part of every push. It runs for lockfile and
      # security-policy changes, release tags, the merge queue, and `full-ci`.
      audit: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'full-ci') || steps.audit_paths.outputs.audit == 'true' || steps.filter.outputs.security_policy == 'true' }}
    steps:
      - name: Ensure full-ci label exists
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "full-ci" \
            --color "5319e7" \
            --description "Run Postgres and Cargo Audit on this pull request" \
            --repo "${{ github.repository }}" 2>/dev/null || true

      - name: Detect Rust-impacting changes
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          # paths-filter defaults to 'some': a file matches a filter if it
          # matches ANY pattern, so the '**' entry would make every PR rust=true.
          # With 'every', a file matches only if it matches ALL patterns: '**'
          # and none of the negated docs-only patterns. The filter is true when
          # at least one changed file matches, i.e. when anything outside the
          # docs-only set changed.
          #
          # SECURITY.md is matched by '!**/*.md' but is validated by
          # check-security-key.sh in Cargo Audit, so it gets its own filter;
          # under 'every' an extra positive pattern in `rust` could not re-add it.
          predicate-quantifier: 'every'
          filters: |
            security_policy:
              - 'SECURITY.md'
            rust:
              - '**'
              - '!docs/**'
              - '!pm/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!CODEOWNERS'
              - '!.github/dependabot.yml'

      # Separate step: `predicate-quantifier: every` would require one file to
      # match every audit path at once. This step uses the default `some`.
      - name: Detect Cargo Audit inputs
        id: audit_paths
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            audit:
              - 'Cargo.lock'
              - '**/Cargo.lock'
              - '.cargo/audit.toml'
              - 'SECURITY.md'
              - 'scripts/check-security-key.sh'
              - 'scripts/test-security-key.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/security-scan.yml'

  release-sign-test:
    name: Offline Release Signing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate regression-test locales
        run: |
          sudo localedef -i da_DK -f ISO-8859-1 da_DK.ISO8859-1
          sudo localedef -i en_US -f UTF-8 en_US.UTF-8
      - name: Exercise the release-signing command offline
        run: bash scripts/test-release-sign.sh

  frontend:
    name: Frontend Build
    # Always-on sentinel. Docs-only and `pm/` pulls skip the heavy jobs, and a
    # skipped job still reports under its required name. This job has no `if`,
    # so a pull request always gets at least one completed check even when the
    # Rust jobs are skipped. Workflow-level paths-ignore is intentionally not
    # used on pull_request, because that would skip this job too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Protocol repo has no frontend
        run: |
          test ! -d frontend
          echo "BitSov-bitsov is protocol-only; frontend build is intentionally satisfied by the absence of frontend/."

  check:
    name: Rust Check & Test
    needs: changes
    # A skipped job reports success under branch protection, so this required
    # check is skipped only when classification succeeded and found docs-only
    # changes. Any other `changes` result fails closed and runs the job.
    # `!cancelled()` (not `always()`) bypasses the implicit success() while
    # still letting PR concurrency cancel this job: GitHub never cancels a
    # running job whose `if:` still evaluates true, as `always()` would.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    env:
      # Keep the hosted runner below linker pressure. ubuntu-latest is 4 vCPU;
      # two cargo jobs leave headroom for rustc and sccache. Incremental is off
      # because sccache plus a restored target/ replaces it, and incremental
      # caches blow the disk.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      # Debuginfo, not debug assertions. `debug = 0` keeps `cfg(debug_assertions)`
      # and shrinks ldk-node enough that the compiled artifacts fit in the
      # Actions cache. Tests still run.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h /

      # Keep Linux GUI/WebKit headers available for optional/transitive crates
      # that still probe these libraries on CI runners.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      # Cache registry crates and path/workspace crates (vendor/lightning,
      # vendor/ldk-node). The default rust-cache mode skips those, so every
      # test run recompiled them (~22 min) even after a "cache hit".
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ hashFiles('Cargo.lock') }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable sccache for Cargo
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Check disk space
        run: df -h /

      - name: cargo check
        run: cargo check --workspace

      # Only drop ldk-node artifacts when the runner is actually short on
      # disk. Unconditional deletion threw away the restored rlibs and forced
      # cargo test to recompile Lightning. Current ubuntu-latest images have
      # ~100GB free at this step.
      - name: Clean before test only under disk pressure
        run: |
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "Available KiB: ${avail_kb}"
          if [ "${avail_kb}" -lt 10485760 ]; then
            rm -rf target/debug/build/ldk-node-* target/debug/deps/libldk_node-* target/debug/incremental/ 2>/dev/null || true
            echo "Removed ldk-node debug artifacts to free disk."
          else
            echo "Disk headroom is sufficient; keeping compiled artifacts."
          fi
          df -h /

      - name: cargo test (core crates only — ldk-node too large for CI runner)
        run: |
          cargo test -p konsensus-recovery -p konsensus-core -p konsensus-crypto -p konsensus-storage \
            -p konsensus-message -p konsensus-pricing -p konsensus-chain \
            -p konsensus-routing -p konsensus-gossip -p konsensus-bsx \
            -p konsensus-lightning -p konsensus-api -p konsensus-node

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  ldk-node-security:
    name: Vendored LDK Node Security Regressions
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/ldk-node
          shared-key: ldk-node-security-${{ hashFiles('vendor/ldk-node/Cargo.lock') }}
          cache-all-crates: "true"
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Cargo
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      # The vendor crate is excluded from --workspace and -p konsensus-*.
      # Run its private-handler regressions plus all existing local patch tests.
      - name: Test vendored ldk-node library
        run: cargo test --locked --manifest-path vendor/ldk-node/Cargo.toml --lib
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  audit:
    name: Cargo Audit
    needs: changes
    # Fail closed if classification did not succeed. Otherwise run only when
    # the advisory inputs changed, on release tags, in the merge queue, or
    # with the `full-ci` label. A daily run of security-scan.yml covers new
    # advisories against an unchanged lockfile. A skipped required check
    # still reports success, same as the docs-only path.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.audit == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security key ↔ policy consistency
        run: bash scripts/test-security-key.sh && bash scripts/check-security-key.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      - name: cargo audit
        run: cargo audit

  semgrep:
    name: Semgrep Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install semgrep
        run: pip install "semgrep==1.179.0"  # 1.180.0 ships without semgrep-core (sdist build); bump deliberately

      # Two-pass scan:
      #   Pass 1 — full report (no --error), all findings visible in CI log.
      #   Pass 2 — ERROR-severity only with --error; blocks the build if any found.
      # Rules exclude test/, mock*, *_test.rs, benches/ — see semgrep-rules.yml.
      # To suppress a specific false positive: add `# nosemgrep: <rule-id>` inline.
      - name: Run BitSov security rules
        run: |
          semgrep --config docs/qa/semgrep-rules.yml \
            --exclude 'target/' \
            --exclude 'vendor/' \
            . || true
          semgrep --config docs/qa/semgrep-rules.yml \
            --severity ERROR --error \
            --exclude 'target/' \
            --exclude 'vendor/' \
            .

  # Build CLI server binary for headless/VPS deployments
  release-cli:
    name: Release CLI (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, ldk-node-security, audit, semgrep]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: bitsov-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: bitsov-linux-aarch64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: bitsov-darwin-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: bitsov-darwin-x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: bitsov-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Tag-only matrix. It is not part of pull_request or main pushes: macOS
      # runners are billed at 10× and Windows at 2×, so running the full
      # matrix on every main push would spend more than it saves.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable sccache for Cargo
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --locked --release -p konsensus-node --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      # Unix (Linux + macOS): build output is `konsensus`. Linux keeps sha256sum (identical to
      # before); macOS has no sha256sum, so fall back to `shasum -a 256`, which emits the SAME
      # "<hash>  <file>" GNU format — so SHA256SUMS assembly and `sha256sum -c` stay identical
      # across every Unix artifact.
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/konsensus artifacts/${{ matrix.artifact }}
          chmod +x artifacts/${{ matrix.artifact }}
          if command -v sha256sum >/dev/null 2>&1; then
            (cd artifacts && sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256)
          else
            (cd artifacts && shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256)
          fi

      # Windows: build output is `konsensus.exe`; there is no sha256sum/chmod. Emit the SAME GNU
      # "<hash>  <file>" line (lowercase hex, two spaces, LF, no BOM) so the checksum file is
      # byte-compatible with the Linux/macOS ones for SHA256SUMS + `sha256sum -c`. The artifact
      # keeps the os-arch name `bitsov-windows-x86_64` (no .exe); only the SOURCE binary is .exe.
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/konsensus.exe" "artifacts/${{ matrix.artifact }}"
          $hash = (Get-FileHash -Algorithm SHA256 "artifacts/${{ matrix.artifact }}").Hash.ToLower()
          $line = "$hash  ${{ matrix.artifact }}`n"
          [System.IO.File]::WriteAllText("artifacts/${{ matrix.artifact }}.sha256", $line, (New-Object System.Text.UTF8Encoding($false)))

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          # The artifact is a single binary FILE, not a directory. `path:` makes
          # sbom-action invoke `syft scan dir:<path>`, which fails on a file
          # ("not a directory source"). `file:` uses the file: scheme so syft
          # scans the binary itself.
          file: artifacts/${{ matrix.artifact }}
          format: spdx-json
          output-file: artifacts/${{ matrix.artifact }}.sbom.spdx.json
          # Do not upload the SBOM as a workflow artifact. sbom-action's upload path
          # calls the download-an-artifact API (needs actions:read, not granted) and
          # failed order-dependently on the 2nd matrix job. We only need the SBOM FILE
          # attached to the release (Upload to Release below), not a workflow artifact.
          upload-artifact: false

      - name: Attest binary provenance
        # GitHub build-provenance attestation requires a public (or paid) repo. The
        # developer debut builds while the repo is still PRIVATE (to stage a draft
        # release before the visibility flip), so skip attestation here — it fails
        # closed on private repos and is a bonus, not the trust anchor (the GPG
        # signature over SHA256SUMS is). It runs automatically on public releases
        # once the repo is flipped public. continue-on-error is a belt-and-suspenders
        # backstop so this step can never fail the release build.
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/${{ matrix.artifact }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          # Stage a DRAFT release. Tag CI builds the CLI binaries + checksums + SBOM,
          # but the release is not published until the operator attaches the GPG-signed
          # SHA256SUMS.asc and the launch go/no-go passes. Publishing an unsigned release
          # on tag push would violate RELEASE_POLICY.md (signed artifacts required) and,
          # at flip, would surface an unsigned "Latest release" to the public.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            artifacts/${{ matrix.artifact }}
            artifacts/${{ matrix.artifact }}.sha256
            artifacts/${{ matrix.artifact }}.sbom.spdx.json
