name: Full CI extras

# Optional label-triggered audit. Never add this job to required checks or
# reuse the required Cargo Audit / Rust Check & Test names here.
# PostgreSQL's optional label run lives in postgres.yml.
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Unrelated labels cannot cancel or replace a pending full-ci run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  audit:
    name: Full CI Cargo Audit (optional)
    if: github.event.label.name == 'full-ci' && github.event.pull_request.draft == false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Security key ↔ policy consistency
        run: bash scripts/test-security-key.sh && bash scripts/check-security-key.sh

      - name: Read Rust toolchain pin
        id: rust-toolchain
        run: echo "channel=$(bash scripts/rust-toolchain-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (upstream has no semver tags)
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      - name: cargo audit
        run: cargo audit
