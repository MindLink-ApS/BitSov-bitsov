name: Daily Security Scan

# cargo audit, osv-scanner, and gitleaks. This is the scheduled advisory sweep.
# Pull-request Cargo Audit (ci.yml) runs only when Cargo.lock or the security
# policy changes or the PR already carries `full-ci`. Non-PR CI runs always
# audit; adding `full-ci` starts a separate optional audit in full-ci.yml.
# This daily sweep also catches new advisories when no code is being pushed.

on:
  schedule:
    - cron: '0 6 * * *'  # every day 06:00 UTC
  workflow_dispatch:      # manual trigger for ad-hoc runs

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  OSV_VERSION: v1.8.5
  GITLEAKS_VERSION: v8.21.2
  # Same pin as ci.yml. The cache key includes this version so a restored
  # cargo-audit binary cannot be an older scanner.
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  security-scan:
    name: cargo-audit + osv-scanner + gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Create the security-scanning repository label.

    steps:
      # Full history needed so gitleaks can scan commit log for leaked secrets.
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (upstream has no semver tags)
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-

      # ── Install tools ──────────────────────────────────────────────────────

      - name: Install cargo-audit ${{ env.CARGO_AUDIT_VERSION }}
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          # `cargo audit --version` prints `cargo-audit-audit <ver>` (clap
          # names the audit subcommand). A direct binary prints
          # `cargo-audit <ver>`. Accept either. Anything else is reinstalled,
          # including a scanner restored from cache.
          got="$(cargo audit --version 2>/dev/null || true)"
          want_sub="cargo-audit-audit ${CARGO_AUDIT_VERSION}"
          want_bin="cargo-audit ${CARGO_AUDIT_VERSION}"
          if [ "$got" != "$want_sub" ] && [ "$got" != "$want_bin" ]; then
            cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked --force
            got="$(cargo audit --version 2>/dev/null || true)"
            if [ "$got" != "$want_sub" ] && [ "$got" != "$want_bin" ]; then
              echo "cargo-audit resolved to '${got}', want ${CARGO_AUDIT_VERSION}" >&2
              exit 1
            fi
          fi

      - name: Install osv-scanner
        run: |
          curl -fsSL \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner

      - name: Install gitleaks
        run: |
          VER="${GITLEAKS_VERSION#v}"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      # ── Run scans ──────────────────────────────────────────────────────────
      # Each scanner runs with continue-on-error so a single scanner failure
      # does not abort the entire workflow — we still want the report.

      - name: Run cargo-audit
        id: cargo_audit
        continue-on-error: true
        run: |
          status=0
          cargo audit --json > /tmp/cargo-audit.json 2>/tmp/cargo-audit.log || status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"

      - name: Require release lockfile
        run: test -s Cargo.lock

      - name: Run osv-scanner
        id: osv_scan
        continue-on-error: true
        # Release builds resolve workspace dependencies from the root Cargo.lock.
        # Vendored crates' standalone lockfiles are not release build inputs:
        # Cargo uses the workspace lockfile for these patched path dependencies.
        # No frontend ships here; add explicit lockfiles if release inputs expand.
        run: |
          status=0
          # Include clean packages so the report can verify nonzero scan coverage.
          osv-scanner --lockfile Cargo.lock --config osv-scanner.toml --format json --experimental-all-packages \
            > /tmp/osv-scan.json 2>/tmp/osv-scan.log || status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"

      # --exit-code 0 suppresses the findings exit code, but tool errors still
      # fail validation below. Keep raw diagnostics out of published reports.
      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          status=0
          gitleaks detect \
            --source . \
            --no-banner \
            --report-format json \
            --report-path /tmp/gitleaks.json \
            --exit-code 0 > /tmp/gitleaks.log 2>&1 || status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"

      # ── Ensure label exists in repository ─────────────────────────────────

      - name: Ensure security-scanning label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "security-scanning" \
            --color "D93F0B" \
            --description "Automated daily security scan findings" \
            --repo "${{ github.repository }}" 2>/dev/null || true

      # ── Generate markdown report ───────────────────────────────────────────

      - name: Generate security report
        id: report
        env:
          CARGO_EXIT_CODE: ${{ steps.cargo_audit.outputs.exit_code }}
          OSV_EXIT_CODE: ${{ steps.osv_scan.outputs.exit_code }}
          GITLEAKS_EXIT_CODE: ${{ steps.gitleaks.outputs.exit_code }}
        run: |
          SCAN_DATE=$(date -u +"%Y-%m-%d")
          SCAN_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPORT_DIR="docs/security/reports"
          REPORT_FILE="${REPORT_DIR}/${SCAN_DATE}.md"
          mkdir -p "$REPORT_DIR"

          # Require exactly one JSON value of the expected shape. Empty files,
          # malformed JSON and concatenated documents must never mean "clean".
          valid_json() {
            [ -s "$1" ] && jq -e -s "length == 1 and (.[0] | $2)" "$1" >/dev/null 2>&1
          }
          SCAN_ERROR=false
          CARGO_ERROR=false
          OSV_ERROR=false
          LEAK_ERROR=false

          # ── Parse cargo-audit ──
          CARGO_VULN_COUNT=0
          CARGO_WARN_COUNT=0
          if [[ "$CARGO_EXIT_CODE" =~ ^[01]$ ]] && valid_json /tmp/cargo-audit.json '
            type == "object" and
            (.vulnerabilities | type == "object") and
            (.vulnerabilities.count | type == "number" and . >= 0 and . == floor) and
            (.vulnerabilities.list | type == "array") and
            (.vulnerabilities.count == (.vulnerabilities.list | length)) and
            all(.vulnerabilities.list[]; type == "object" and
              (.advisory.id | type == "string") and (.package.name | type == "string")) and
            (.warnings | type == "object" and all(.[]; type == "array" and
              all(.[]; type == "object" and (.package.name | type == "string"))))'; then
            CARGO_VULN_COUNT=$(jq '.vulnerabilities.count' /tmp/cargo-audit.json)
            CARGO_WARN_COUNT=$(jq '[.warnings[] | length] | add // 0' /tmp/cargo-audit.json)
            # Exit 1 with no findings is an operational failure, not a clean scan.
            if [ "$CARGO_EXIT_CODE" = 1 ] && [ "$CARGO_VULN_COUNT" -eq 0 ]; then
              CARGO_ERROR=true
            fi
          else
            CARGO_ERROR=true
          fi

          # ── Parse osv-scanner ──
          OSV_COUNT=0
          OSV_PACKAGE_COUNT=0
          if [[ "$OSV_EXIT_CODE" =~ ^[01]$ ]] && valid_json /tmp/osv-scan.json '
            type == "object" and (.results | type == "array") and
            all(.results[]; type == "object" and (.packages | type == "array") and
              all(.packages[]; type == "object" and (.package | type == "object") and
                (.package.name | type == "string") and (.package.version | type == "string") and
                ((has("vulnerabilities") | not) or
                  (.vulnerabilities | type == "array" and all(.[]; type == "object" and (.id | type == "string"))))))'; then
            OSV_PACKAGE_COUNT=$(jq '[.results[].packages[]] | length' /tmp/osv-scan.json)
            OSV_COUNT=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' \
              /tmp/osv-scan.json)
            if [ "$OSV_PACKAGE_COUNT" -eq 0 ] || { [ "$OSV_EXIT_CODE" = 1 ] && [ "$OSV_COUNT" -eq 0 ]; }; then
              OSV_ERROR=true
            fi
          else
            OSV_ERROR=true
          fi

          # ── Parse gitleaks ──
          LEAK_COUNT=0
          if [ "$GITLEAKS_EXIT_CODE" = 0 ] && valid_json /tmp/gitleaks.json '
            type == "array" and all(.[]; type == "object" and
              (.RuleID | type == "string") and (.File | type == "string") and (.Secret | type == "string"))'; then
            LEAK_COUNT=$(jq 'length' /tmp/gitleaks.json)
          else
            LEAK_ERROR=true
          fi

          # ── Overall status ──
          HAS_FINDINGS=false
          [ "${CARGO_VULN_COUNT}" -gt 0 ] && HAS_FINDINGS=true
          [ "${OSV_COUNT}"        -gt 0 ] && HAS_FINDINGS=true
          [ "${LEAK_COUNT}"       -gt 0 ] && HAS_FINDINGS=true

          cargo_status=$([ "${CARGO_VULN_COUNT}" -gt 0 ] && echo "FINDINGS (${CARGO_VULN_COUNT})" || echo "clean")
          osv_status=$([ "${OSV_COUNT}"           -gt 0 ] && echo "FINDINGS (${OSV_COUNT})"        || echo "clean")
          leak_status=$([ "${LEAK_COUNT}"         -gt 0 ] && echo "FINDINGS (${LEAK_COUNT})"       || echo "clean")
          overall=$([ "${HAS_FINDINGS}" = "true" ]         && echo "REQUIRES REVIEW"               || echo "ALL CLEAR")
          if [ "$CARGO_ERROR" = true ] || [ "$OSV_ERROR" = true ] || [ "$LEAK_ERROR" = true ]; then
            SCAN_ERROR=true
            overall="SCAN ERROR — triage privately"
          fi
          [ "$CARGO_ERROR" = true ] && cargo_status="SCAN ERROR"
          [ "$OSV_ERROR" = true ] && osv_status="SCAN ERROR"
          [ "$LEAK_ERROR" = true ] && leak_status="SCAN ERROR"

          # ── Build cargo-audit detail section ──
          CARGO_DETAIL="No vulnerabilities found."
          if [ "${CARGO_VULN_COUNT}" -gt 0 ] && [ -f /tmp/cargo-audit.json ] && [ -s /tmp/cargo-audit.json ]; then
            CARGO_DETAIL=$(jq -r '
              .vulnerabilities.list[]
              | "- **\(.advisory.id)** [\(.advisory.severity)] `\(.package.name) \(.package.version)`  \n  \(.advisory.title)  \n  <\(.advisory.url)>"
            ' /tmp/cargo-audit.json 2>/dev/null || echo "Error parsing cargo-audit output.")
          fi
          if [ "${CARGO_WARN_COUNT}" -gt 0 ]; then
            CARGO_WARN_DETAIL=$(jq -r '
              .warnings | to_entries[]
              | .key as $kind
              | .value[]
              | "- [\($kind)] `\(.package.name) \(.package.version)`"
            ' /tmp/cargo-audit.json 2>/dev/null || echo "")
            CARGO_DETAIL=$(printf '%s\n\n**Warnings (%s):**\n%s' "${CARGO_DETAIL}" "${CARGO_WARN_COUNT}" "${CARGO_WARN_DETAIL}")
          fi

          # ── Build osv-scanner detail section ──
          OSV_DETAIL="No vulnerabilities found."
          if [ "${OSV_COUNT}" -gt 0 ] && [ -f /tmp/osv-scan.json ] && [ -s /tmp/osv-scan.json ]; then
            OSV_DETAIL=$(jq -r '
              .results[]?.packages[]?
              | . as $pkg
              | .vulnerabilities[]?
              | "- **\(.id)** [\(.database_specific.severity // "UNKNOWN")] `\($pkg.package.name) \($pkg.package.version)`  \n  \(.summary // "")"
            ' /tmp/osv-scan.json 2>/dev/null || echo "Error parsing osv-scanner output.")
          fi

          # ── Build gitleaks detail section ──
          LEAK_DETAIL="No secrets found."
          if [ "${LEAK_COUNT}" -gt 0 ] && [ -f /tmp/gitleaks.json ] && [ -s /tmp/gitleaks.json ]; then
            LEAK_DETAIL="Potential secrets found. Details are intentionally withheld from generated reports; triage the restricted runner output and rotate before publishing any public summary."
          fi
          ERROR_DETAIL="Scan could not be verified (tool failure, missing/invalid output, or zero OSV packages). Triage privately; do not treat this as clean."
          [ "$CARGO_ERROR" = true ] && CARGO_DETAIL="$ERROR_DETAIL"
          [ "$OSV_ERROR" = true ] && OSV_DETAIL="$ERROR_DETAIL"
          [ "$LEAK_ERROR" = true ] && LEAK_DETAIL="$ERROR_DETAIL"

          # ── Write report ──
          {
            printf '# Security Scan Report — %s\n\n' "${SCAN_DATE}"
            printf '**Generated:** %s  \n' "${SCAN_TIME}"
            printf '**Commit:** `%s`  \n' "${GITHUB_SHA:0:8}"
            printf '**Overall status:** %s\n\n' "${overall}"
            printf '%s\n\n' '---'
            printf '## Summary\n\n'
            printf '| Scanner | Status |\n'
            printf '|---------|--------|\n'
            printf '| cargo-audit | %s |\n' "${cargo_status}"
            printf '| osv-scanner | %s |\n' "${osv_status}"
            printf '| gitleaks | %s |\n\n' "${leak_status}"
            printf '%s\n\n' '---'
            printf '## cargo-audit\n\n'
            printf '%s\n\n' "${CARGO_DETAIL}"
            printf '%s\n\n' '---'
            printf '## osv-scanner\n\n'
            printf '%s\n\n' "${OSV_DETAIL}"
            printf '%s\n\n' '---'
            printf '## gitleaks\n\n'
            printf '%s\n\n' "${LEAK_DETAIL}"
            printf '%s\n\n' '---'
            printf '_Automated report. Generated by `.github/workflows/security-scan.yml`._\n'
          } > "${REPORT_FILE}"

          echo "has_findings=${HAS_FINDINGS}"          >> "$GITHUB_OUTPUT"
          echo "scan_error=${SCAN_ERROR}"              >> "$GITHUB_OUTPUT"
          echo "report_file=${REPORT_FILE}"            >> "$GITHUB_OUTPUT"
          echo "scan_date=${SCAN_DATE}"                >> "$GITHUB_OUTPUT"
          echo "cargo_vuln_count=${CARGO_VULN_COUNT}"  >> "$GITHUB_OUTPUT"
          echo "osv_count=${OSV_COUNT}"                >> "$GITHUB_OUTPUT"
          echo "leak_count=${LEAK_COUNT}"              >> "$GITHUB_OUTPUT"

      # ── Upload report as artifact (always) ────────────────────────────────

      - name: Upload security report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report-${{ steps.report.outputs.scan_date }}
          path: ${{ steps.report.outputs.report_file }}
          retention-days: 90

      # ── Fail when findings exist or a scan could not be verified ────────────
      # Do not commit leak metadata or open public PRs with confirmed file paths.

      - name: Fail on security findings or scan errors
        if: steps.report.outputs.has_findings == 'true' || steps.report.outputs.scan_error == 'true'
        run: |
          echo "Security scan found issues or could not be verified. Triage privately; do not publish leak metadata in a PR."
          exit 1
