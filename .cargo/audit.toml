[advisories]
# RUSTSEC-2024-0436: allow paste's unmaintained warning via sqlx-core 0.8.0; paste-free SQLx 0.8.6 needs libsqlite3-sys ^0.30, conflicting with LDK's ^0.28 pin (#59).
# Accepted dependency debt: the ldk-node/sqlx SQLite island.
#
# Context:
# - The workspace pins sqlx to 0.8.0 because sqlx 0.8.1+ moves to a
#   libsqlite3-sys range that conflicts with ldk-node 0.7.0's rusqlite stack.
# - These ignores keep Cargo Audit useful: new, unrelated vulnerabilities still
#   fail CI, while this known island remains explicit and reviewable.
# - Revisit before the first public release candidate, and remove once ldk-node
#   or the storage backend dependency graph can move forward.
#
# Applicability triage 2026-09-14 (issue #59). What this file must NOT be read as
# saying: "we only use SQLite, so the Postgres advisory cannot apply." That is
# false for the artifact we ship. The workspace enables the `postgres` feature,
# `sqlx-postgres 0.8.0` links into konsensus-node via konsensus-storage, and
# StorageConfig::Postgres is a fully implemented, documented backend. An operator
# running Postgres runs the affected code.
#
# What actually makes RUSTSEC-2024-0363 unreachable is the INPUT SIZE CAPS: the
# advisory needs a bound parameter larger than 4 GiB to overflow the protocol
# length prefix, and every input path is capped far below that —
#   * wire frames: MAX_FRAME_BYTES = 16 MiB (konsensus-message/src/wire.rs),
#     enforced in the decoder and in transport/mod.rs;
#   * REST API: axum's default 2 MiB body limit, never raised or disabled.
# 4 GiB is 256x the wire cap.
#
# RECHECK TRIGGER — that deferral rests on those caps, not on the sqlx version:
# re-run the triage if MAX_FRAME_BYTES is raised, if the axum body limit is
# changed, or if a new storage backend is added.
#
# SCOPE OF THE SIZE-CAP ARGUMENT — it covers RUSTSEC-2024-0363 ONLY.
# Correcting the first triage (2026-09-14), which closed too broadly with "no
# advisory in this island is reachable". Request size limits bound how much data
# reaches a query; they say nothing about CERTIFICATE VALIDATION. The three
# rustls-webpki 0.101.7 entries below are cert-path bugs and the size-cap
# reasoning must not be read as covering them.
#
# Those three have their own, narrower arguments — recorded per-advisory in
# deny.toml, which is the authoritative analysis and is more specific than a
# blanket claim in either direction:
#   * -0098 URI-name constraints: this library exposes no URI-name assertion API
#     to us, and exploitation needs a misissued cert, post-signature-verify;
#   * -0099 wildcard DNS-name constraint: same path, also requires misissuance
#     post-signature-verify;
#   * -0104 CRL parsing panic: BitSov does not parse CRLs at all.
# Additionally, SQLite deployments — the default, and every deployment we ship
# today — open no database TLS connection, so sqlx's rustls stack is never
# exercised there. A Postgres-over-TLS deployment would exercise it, and the
# narrow arguments above are what carry the risk then, not the size caps.
#
# NOTE the Postgres backend is ALREADY SELECTABLE — `StorageConfig::Postgres`
# is implemented and documented, not a future capability. So this is not a
# "before we add Postgres" note: anyone standing up a Postgres-over-TLS
# deployment today must re-read the three per-advisory arguments in deny.toml
# against that configuration rather than inheriting this waiver wholesale.
#
# OPEN #59 FOLLOW-UPS (operator decisions, not resolvable here): state the
# supported deployment scope, name a risk owner and a revisit date for the
# remaining island, and assess the SQL encoded-size argument. This file records
# what is known; it does not stand in for those decisions.
ignore = [
  # In Cargo.lock but NEVER COMPILED (the `mysql` feature is off, and neither rsa
  # nor sqlx-mysql appears in `cargo tree -e normal`). The ignore is still needed
  # because cargo-audit reads Cargo.lock and performs no feature resolution.
  "RUSTSEC-2023-0071",
  # sqlx 0.8.0, pinned by the libsqlite3-sys conflict documented in Cargo.toml.
  # Postgres IS compiled and selectable — see the size-cap reasoning above for why
  # the >4 GiB precondition cannot be met. Not "unaffected because SQLite".
  "RUSTSEC-2024-0363",
  # rustls-webpki 0.101.7 via the sqlx legacy island — CERTIFICATE
  # VALIDATION bugs. A SQLite deployment opens no database TLS connection, so
  # this stack is never exercised there. Postgres TLS DOES exercise it;
  # applicability then differs per advisory and per configuration — see the
  # per-advisory reasoning in deny.toml (no URI-name API exposed, misissuance
  # required post-signature-verify, no CRL parsing). The size-cap reasoning
  # above does not apply to any of these.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  # Applicability triage 2026-10-15 — rustls 0.21.12 via sqlx-core 0.8.0,
  # held by the SQLite dependency conflict above. rustls 0.23 is patched to
  # 0.23.46 in both the root and vendor/ldk-node lockfiles; these exceptions
  # accept ONLY the legacy rustls island. cargo-audit ignores advisory IDs,
  # not package versions: do not downgrade 0.23 or treat this as its waiver.
  #
  # TLS IS COMPILED AND REACHABLE: Cargo.toml enables runtime-tokio-rustls
  # and postgres. StorageConfig::Postgres -> PostgresStorage::connect(url)
  # -> PgPoolOptions::connect passes through sslmode; SQLx defaults to Prefer
  # and negotiates TLS when offered, and Require/VerifyCa/VerifyFull need it.
  # Disabling TLS would silently remove encryption with Prefer and break
  # TLS-required deployments. SQLite opens no database TLS connection; that
  # does NOT make Postgres-over-TLS unaffected. Input size caps do not help.
  #
  # RUSTSEC-2026-0346 — session-value Debug output can disclose TLS secrets.
  # SQLx's net/tls/tls_rustls.rs uses ClientConfig's built-in session cache;
  # neither SQLx nor our code installs a custom ClientSessionStore or formats
  # Tls12ClientSessionValue/Tls13ClientSessionValue. The advisory excludes
  # ordinary connection/cache Debug output. No current secret-logging path was found, even with Postgres TLS.
  # RESIDUAL RISK: the vulnerable Debug impls remain compiled; adding session
  # value logging/custom cache instrumentation could expose master secrets or
  # resumption PSKs to log readers. Recheck any TLS/session/logging changes;
  # remove this exception when the sqlx/ldk-node island can be upgraded (#59).
  "RUSTSEC-2026-0346",
  # RUSTSEC-2026-0349 — unauthenticated ServerHello poisons the cached key-share
  # hint for later connections. SQLx constructs a fresh ClientConfig (and
  # session cache) per handshake, so hints are not reused across connections.
  # rustls 0.21.12's safe defaults offer only X25519/P-256/P-384: no hybrid/PQ
  # group exists to lose.
  # RESIDUAL RISK: the pre-authentication hint write remains in this legacy
  # client, and Postgres TLS already provides classical-only confidentiality;
  # this is not a claim of post-quantum protection or a patched dependency.
  # Recheck shared-config/cache changes, key-exchange policy, or any new
  # rustls 0.21 consumer. Remove on the sqlx/ldk-node island upgrade (#59).
  "RUSTSEC-2026-0349",
  # Applicability triage 2026-10-20 — RUSTSEC-2026-0382 / CVE-2026-111943:
  # rustls-webpki 0.101.7 may accept certificate chains through distrusted
  # emSign intermediates whose private keys are publicly known, when the
  # configured trust anchors permit the path. Runtime path: konsensus-storage
  # -> sqlx-core 0.8.0 -> rustls 0.21.12 -> rustls-webpki 0.101.7.
  # This is SQLx Postgres TLS only: the default SQLite node opens no TLS
  # through this stack. Postgres is already selectable and TLS is reachable;
  # neither the SQLite default nor query size caps mitigate that deployment.
  # The 0.103.x copy is already patched to 0.103.16 in this branch; this
  # exception accepts only the 0.101.7 island held by the sqlx/ldk-node pin.
  # cargo-audit ignores advisory IDs, not versions: do not downgrade 0.103.x.
  #
  # RESIDUAL RISK: a Postgres-over-TLS deployment could accept a certificate
  # chain through a distrusted intermediate if its configured trust anchors
  # allow it, enabling server impersonation with a known intermediate key.
  # This is accepted residual certificate-validation risk, not a claim that
  # the legacy verifier is patched.
  # Recheck Postgres TLS/trust-store changes or any new rustls 0.21 consumer;
  # remove on the sqlx/ldk-node island upgrade (#59).
  "RUSTSEC-2026-0382",
  # Applicability triage 2026-10-20 — RUSTSEC-2026-0381 / CVE-2026-111943:
  # webpki-roots 0.25.4 includes emSign ECC Root CA - G3, which can allow
  # certificate paths through distrusted emSign intermediates whose private
  # keys are publicly known. The runtime Electrum copy is now remediated via
  # vendor/electrum-client (webpki-roots >=1.0.10); the 1.0.x line is patched
  # to 1.0.10. Remaining 0.25.4 copies are reachable only via sqlx-core 0.8.0
  # / rustls 0.21 Postgres TLS. The default SQLite node
  # opens no TLS through this stack; Postgres TLS is already selectable.
  # This exception accepts only that legacy sqlx/ldk-node dependency island.
  # cargo-audit ignores advisory IDs, not versions:
  # do not downgrade the patched 1.0.x line or reintroduce an Electrum copy.
  #
  # RESIDUAL RISK: the legacy root bundle can permit a Postgres-over-TLS
  # deployment to accept chains through distrusted emSign intermediates,
  # enabling server impersonation with a known intermediate private key.
  # This is accepted certificate-trust
  # risk, not a claim that 0.25.4 is patched; SQLite defaults and query size
  # caps do not mitigate Postgres TLS. Recheck TLS/trust-store changes, new
  # consumers of 0.25.4;
  # remove on the sqlx/ldk-node island upgrade (#59).
  "RUSTSEC-2026-0381",
  "RUSTSEC-2025-0134", # rustls-pemfile 1.0.4 UNMAINTAINED via sqlx-core 0.8.0 island (same pin); no known vuln. Remove on sqlx bump (#59).
]
