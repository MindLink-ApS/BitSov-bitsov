[advisories]
# Accepted until the ldk-node/sqlx SQLite dependency island is upgraded.
#
# Context:
# - The workspace pins sqlx to 0.8.0 because sqlx 0.8.1+ moves to a
#   libsqlite3-sys range that conflicts with ldk-node 0.7.0's rusqlite stack.
# - These ignores keep Cargo Audit useful: new, unrelated vulnerabilities still
#   fail CI, while this known island remains explicit and reviewable.
# - Revisit before the first public release candidate, and remove once ldk-node
#   or the storage backend dependency graph can move forward.
#
# Applicability triage 2026-09-14 (issue #59). What this file must NOT be read as
# saying: "we only use SQLite, so the Postgres advisory cannot apply." That is
# false for the artifact we ship. The workspace enables the `postgres` feature,
# `sqlx-postgres 0.8.0` links into konsensus-node via konsensus-storage, and
# StorageConfig::Postgres is a fully implemented, documented backend. An operator
# running Postgres runs the affected code.
#
# What actually makes RUSTSEC-2024-0363 unreachable is the INPUT SIZE CAPS: the
# advisory needs a bound parameter larger than 4 GiB to overflow the protocol
# length prefix, and every input path is capped far below that —
#   * wire frames: MAX_FRAME_BYTES = 16 MiB (konsensus-message/src/wire.rs),
#     enforced in the decoder and in transport/mod.rs;
#   * REST API: axum's default 2 MiB body limit, never raised or disabled.
# 4 GiB is 256x the wire cap.
#
# RECHECK TRIGGER — that deferral rests on those caps, not on the sqlx version:
# re-run the triage if MAX_FRAME_BYTES is raised, if the axum body limit is
# changed, or if a new storage backend is added.
#
# SCOPE OF THE SIZE-CAP ARGUMENT — it covers RUSTSEC-2024-0363 ONLY.
# Correcting the first triage (2026-09-14), which closed too broadly with "no
# advisory in this island is reachable". Request size limits bound how much data
# reaches a query; they say nothing about CERTIFICATE VALIDATION. The three
# rustls-webpki 0.101.7 entries below are cert-path bugs and the size-cap
# reasoning must not be read as covering them.
#
# Those three have their own, narrower arguments — recorded per-advisory in
# deny.toml, which is the authoritative analysis and is more specific than a
# blanket claim in either direction:
#   * -0098 URI-name constraints: this library exposes no URI-name assertion API
#     to us, and exploitation needs a misissued cert, post-signature-verify;
#   * -0099 wildcard DNS-name constraint: same path, also requires misissuance
#     post-signature-verify;
#   * -0104 CRL parsing panic: BitSov does not parse CRLs at all.
# Additionally, SQLite deployments — the default, and every deployment we ship
# today — open no database TLS connection, so sqlx's rustls stack is never
# exercised there. A Postgres-over-TLS deployment would exercise it, and the
# narrow arguments above are what carry the risk then, not the size caps.
#
# BEFORE Postgres-over-TLS is supported or recommended, re-read those three
# arguments against that configuration rather than inheriting this waiver.
ignore = [
  # In Cargo.lock but NEVER COMPILED (the `mysql` feature is off, and neither rsa
  # nor sqlx-mysql appears in `cargo tree -e normal`). The ignore is still needed
  # because cargo-audit reads Cargo.lock and performs no feature resolution.
  "RUSTSEC-2023-0071",
  # sqlx 0.8.0, pinned by the libsqlite3-sys conflict documented in Cargo.toml.
  # Postgres IS compiled and selectable — see the size-cap reasoning above for why
  # the >4 GiB precondition cannot be met. Not "unaffected because SQLite".
  "RUSTSEC-2024-0363",
  # rustls-webpki 0.101.7 via the sqlx/minreq legacy island — CERTIFICATE
  # VALIDATION bugs. Unreachable for SQLite deployments (no database TLS
  # connection is ever opened); EXPOSED for Postgres-over-TLS. See the scope
  # note above — the size-cap reasoning does not apply to these.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2025-0134", # rustls-pemfile 1.0.4 UNMAINTAINED via sqlx-core 0.8.0 island (same pin); no known vuln. Remove on sqlx bump (#59).
]
