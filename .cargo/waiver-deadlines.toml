# Deadlines for every advisory waived in .cargo/audit.toml, deny.toml and
# osv-scanner.toml. This file is the one source of the dates: each [[waiver]]
# groups an advisory with its aliases, so they cannot drift apart.
#
# cargo-audit and cargo-deny have no expiry field for an ignore, so
# scripts/check-waiver-deadlines.py enforces these dates for them in CI. The OSV
# entries repeat the date as `ignoreUntil`, which osv-scanner enforces itself, and
# the check requires it to match.
#
# A waiver stops on its deadline day (UTC). To keep one past that date, recheck the
# advisory and change the date in a reviewed PR. No advisory here has a specific
# reason for an earlier date today.

# rsa through sqlx-mysql, which is not compiled.
[[waiver]]
ids = ["RUSTSEC-2023-0071"]
deadline = 2027-02-03

