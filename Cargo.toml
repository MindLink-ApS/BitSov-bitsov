[workspace]
members = [
    "crates/konsensus-core",
    "crates/konsensus-chain",
    "crates/konsensus-lightning",
    "crates/konsensus-pricing",
    "crates/konsensus-message",
    "crates/konsensus-crypto",
    "crates/konsensus-storage",
    "crates/konsensus-api",
    "crates/konsensus-routing",
    "crates/konsensus-gossip",
    "crates/konsensus-node",
    "crates/konsensus-bsx",
    "crates/konsensus-fiat",
    "crates/konsensus-mobile",
]
exclude = [
    "frontend/src-tauri",
    "bitsov-browser",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
# All workspace crates use thiserror 2.x. Thiserror 1.x remains as a transitive
# dependency pulled in by: sqlx 0.8.0 (pinned; ldk-node 0.7.0 requires rusqlite
# 0.31 → libsqlite3-sys ^0.28, incompatible with sqlx 0.8.1+ which needs ^0.30),
# tungstenite 0.24.0 (axum 0.7 requires ^0.24), and displaydoc 0.2.5 (icu crates,
# latest available). These are third-party constraints we cannot resolve until
# ldk-node upgrades rusqlite or axum 0.8 migration is undertaken.
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
# Pinned to 0.8.0: sqlx 0.8.1+ requires libsqlite3-sys >=0.30 which conflicts with
# ldk-node 0.7.0's rusqlite 0.31 (needs libsqlite3-sys 0.28). RUSTSEC-2024-0363 only
# affects PostgreSQL/MySQL binary protocols, not SQLite (our backend). The future-compat
# warning in sqlx-postgres 0.8.0 (never type fallback) only becomes a hard error in
# Rust 2024 edition. Upgrade when ldk-node updates to rusqlite 0.32+.
sqlx = { version = "=0.8.0", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "migrate", "chrono", "uuid"] }

# HTTP / API
axum = { version = "0.7", features = ["ws", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Metrics / observability (P10: runtime monitoring)
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# Cryptography
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2.0", features = ["serde", "static_secrets"] }
aes-gcm = "0.10"
argon2 = "0.5"
snow = "0.9"
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
blake3 = "1"

# Bitcoin / Lightning
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }
bip39 = { version = "2", features = ["rand"] }
ldk-node = "0.7"
lightning-invoice = "0.34"
# tonic/prost — reserved for future gRPC (LND/CLN) providers
# openmls — reserved for future MLS group E2EE (ADR-007: using Sender Keys for now)

# CLI
clap = { version = "4", features = ["derive"] }
rpassword = "5"

# Config
toml = "0.8"

# JWT
jsonwebtoken = "9"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.9", features = ["serde"] }

# Testing
mockall = "0.13"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

# Encoding
bs58 = "0.5"

# Security
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# Misc
bytes = "1"
hex = "0.4"
base64 = "0.22"
unicode-normalization = "0.1"
