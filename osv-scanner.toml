[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2026-12-09T00:00:00Z
reason = "Bundled libsqlite3-sys 0.28.0 is vulnerable to process-memory disclosure when opening a crafted database and mismatched-page-size sibling WAL. Applicability waiver ONLY for exclusively trusted local DB/WAL provenance in SQLx, LDK, tower and durable-relay stores. Custom/external paths, operator-prepared databases and manually restored backups require the same trust; untrusted or externally writable files are NOT covered. Directory permissions, header probes and record encryption do not authenticate existing files or patch SQLite. Peers do not supply raw database files; mnemonic restore creates fresh state and whitelist restore authenticates record JSON. Fix >=0.39 requires coordinated SQLx/rusqlite changes, not a lockfile-only bump. Recheck import/restore, path/permission and dependency changes; remove on upgrade or loss of trusted-file provenance. Expires 2026-12-09. Full scope: .cargo/audit.toml."

