id = "RUSTSEC-2026-0382"
reason = "rustls-webpki 0.101.7 via sqlx-core 0.8.0 -> rustls 0.21.12, pinned by the sqlx/ldk-node SQLite conflict (#59), plus test-only minreq. Accepts distrusted emSign intermediates when trust anchors permit the path. Runtime use is SQLx Postgres TLS only; the default SQLite node opens no TLS through it. RESIDUAL RISK: a Postgres-over-TLS deployment could accept a chain through a distrusted intermediate, enabling server impersonation; test-only minreq shares this risk. The 0.103.x copy is already patched to 0.103.16 in this branch and is not waived. Recheck TLS/trust-store changes or runtime minreq use; remove on the sqlx/ldk-node island upgrade (#59). Full triage: .cargo/audit.toml; alias CVE-2026-111943."

