id = "GHSA-h2v8-394m-p7vv"
ignoreUntil = 2027-02-03
reason = "rustls Brotli certificate decompression; alias RUSTSEC-2026-0348. Only 0.21.12 matches, via pinned sqlx-core 0.8.0. That version has no certificate compression code and no brotli feature, and Cargo.lock has no brotli crate. rustls 0.21 has no fixed release: the fix is 0.23.46, which sqlx 0.8.0 cannot use, and newer sqlx is blocked by the sqlite conflict (#59). The rustls 0.23 copy is already 0.23.46. Remove on the sqlx/ldk-node upgrade (#59). Recheck if a new rustls 0.21 consumer or a brotli crate appears."
