[package]
name = "konsensus-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
konsensus-recovery = { path = "../konsensus-recovery" }
konsensus-core = { path = "../konsensus-core" }
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
bitcoin.workspace = true
reqwest.workspace = true
esplora-client = { version = "0.12", default-features = false, features = ["async-https-rustls", "tokio"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true
toml.workspace = true
rustix = { version = "1", features = ["fs", "process"] }
