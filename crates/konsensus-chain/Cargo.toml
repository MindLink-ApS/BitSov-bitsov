rand.workspace = true

electrum-client = { version = "0.24", default-features = false, features = ["proxy", "use-rustls-ring"] }

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile = "3"
mockall.workspace = true
tokio = { workspace = true, features = ["test-util"] }
