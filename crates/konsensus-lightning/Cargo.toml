[package]
name = "konsensus-lightning"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Gate the LDK integration test behind a feature flag because it auto-downloads
# bitcoind + electrs binaries (~100 MB) and takes minutes to run.
ldk-integration-test = ["dep:electrsd"]

[dependencies]
konsensus-core = { path = "../konsensus-core" }
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
hex.workspace = true
rand.workspace = true
aes-gcm.workspace = true
base64.workspace = true
sha2.workspace = true
ldk-node.workspace = true
bip39.workspace = true
bitcoin.workspace = true
blake3.workspace = true
rusqlite = "0.31"
electrsd = { version = "0.36", features = ["corepc-node_28_2", "esplora_a33e97e1"], optional = true }

[dev-dependencies]
mockall.workspace = true
mockito = "1"
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true
serde_json.workspace = true
tempfile = "3"
