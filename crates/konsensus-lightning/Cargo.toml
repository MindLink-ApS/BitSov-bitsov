[package]
name = "konsensus-lightning"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Gate the LDK integration test behind a feature flag because it auto-downloads
# bitcoind + electrs binaries (~100 MB) and takes minutes to run.
ldk-integration-test = ["dep:electrsd"]

[dependencies]
konsensus-crypto = { path = "../konsensus-crypto" }
konsensus-chain = { path = "../konsensus-chain" }
konsensus-core = { path = "../konsensus-core" }
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
thiserror.workspace = true
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
metrics.workspace = true
chrono.workspace = true
hex.workspace = true
rand.workspace = true
aes-gcm.workspace = true
base64.workspace = true
sha2.workspace = true
ldk-node.workspace = true
bip39.workspace = true
bitcoin.workspace = true
lightning-invoice.workspace = true
blake3.workspace = true
chacha20poly1305 = "0.10.1"
zeroize.workspace = true
rusqlite = "0.31"
electrsd = { version = "0.36", features = ["corepc-node_28_2", "esplora_a33e97e1"], optional = true }

[dev-dependencies]
metrics-exporter-prometheus.workspace = true
mockall.workspace = true
mockito = "1"
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true
serde_json.workspace = true
tempfile = "3"
konsensus-storage = { path = "../konsensus-storage" }
sqlx.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
