[package]
name = "konsensus-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "konsensus"
path = "src/main.rs"

[features]
mdns = ["dep:mdns-sd"]
regtest-e2e = ["dep:corepc-node"]

[dependencies]
konsensus-recovery = { path = "../konsensus-recovery" }
bitcoin.workspace = true
if-addrs = "0.15"
# Already in the lockfile; set an explicit dual-stack policy for wildcard IPv6.
socket2 = "0.6"
mdns-sd = { version = "0.21.5", optional = true, default-features = false }
# Terminal-only QR encoder: no image, SVG or picture dependencies.
qrcode = { version = "=0.14.1", default-features = false }
corepc-node = { version = "0.12.0", optional = true }
konsensus-core = { path = "../konsensus-core" }
konsensus-chain = { path = "../konsensus-chain" }
konsensus-fiat = { path = "../konsensus-fiat" }
konsensus-lightning = { path = "../konsensus-lightning" }
konsensus-pricing = { path = "../konsensus-pricing" }
konsensus-message = { path = "../konsensus-message" }
konsensus-crypto = { path = "../konsensus-crypto" }
konsensus-storage = { path = "../konsensus-storage" }
konsensus-api = { path = "../konsensus-api" }
konsensus-routing = { path = "../konsensus-routing" }
konsensus-gossip = { path = "../konsensus-gossip" }
axum.workspace = true
# Explicit HTTP/1 header deadline on the isolated LAN setup listener.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["tracing-log"] }
metrics.workspace = true
toml.workspace = true
serde.workspace = true
anyhow.workspace = true
hex.workspace = true
rand.workspace = true
chrono.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures.workspace = true
base64.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
uuid.workspace = true
thiserror.workspace = true
rpassword.workspace = true
sha2.workspace = true
reqwest.workspace = true
zeroize.workspace = true
# getuid (password-file owner check) and, in tests, setsid.
libc = "0.2"
# P8.1 D-place (A): the durable SqliteRelayStore (relay/store.rs) is colocated with
# the trait + InMemory impl in konsensus-node, so this crate takes a direct sqlx dep
# (already pulled transitively via konsensus-storage). Off-by-default: InMemoryRelayStore
# stays the wired store until an operator flips a relay to the durable backend.
sqlx.workspace = true

lightning-invoice.workspace = true

[dev-dependencies]
# Decode terminal output in the P1 regression; no image stack.
quircs = "=0.10.3"
ring = "0.17"
log = "0.4"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
async-trait.workspace = true
tempfile = "3"
ldk-node.workspace = true
tower = { workspace = true, features = ["util"] }
lightning-invoice.workspace = true
secp256k1 = "0.29"
